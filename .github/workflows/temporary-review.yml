name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/5abfad6c6c535642c0843309612d951517fc0b7a > episode-five-sophia-walk-26a423b0.mp4
          echo '26a423b0a77251c5383ef41621a252a29119a2895cf7c516c0ad335ce9b5ba98  episode-five-sophia-walk-26a423b0.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-sophia-walk-26a423b0.mp4 --clobber
