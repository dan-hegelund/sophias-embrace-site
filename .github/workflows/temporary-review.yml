name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 5 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://appreciation-promotion-ranging-cents.trycloudflare.com/z3I_pDqLTAW48IvIXWUnvhTSbeSirhuUbi-MYQ/@'
          cat fragments/?? > episode-five-opening23-a30b8440.mp4
          echo 'a30b8440c73e2c8ee0122d7f668c0774feafdcb7551c66b652e11036815387e0  episode-five-opening23-a30b8440.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-opening23-a30b8440.mp4 --clobber