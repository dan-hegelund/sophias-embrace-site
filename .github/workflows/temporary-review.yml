name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 34 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://skin-additions-throw-upload.trycloudflare.com/jrz6cLTCY1MZb9S77jak5bLH76dPrJTsc5W9ow/@'
          cat fragments/?? > episode-five-full15-511936ae.mp4
          echo '511936aed7e0d22aa95752a2ecb9f517f84f28a62346c8c48e020b06a7ec823b  episode-five-full15-511936ae.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-full15-511936ae.mp4 --clobber
