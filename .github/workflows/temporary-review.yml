name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output episode-five-r5-bed7934f.mp4 'https://spread-used-come-urw.trycloudflare.com/TsFLaAYFHw5h_hlaj3zsuFTfnHOgh_cwSjBQMw'
          echo 'bed7934f35c6bb9bd256aa3182045d6731e5574d7ce36eaa35cb54de42d18bba  episode-five-r5-bed7934f.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-r5-bed7934f.mp4 --clobber
