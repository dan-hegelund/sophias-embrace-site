name: Share Zemlya picture edit
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and host the picture edit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=phone-review/zemlya-hunt08.mp4
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 0-1999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=0" -o /tmp/part00 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 2000000-3999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=1" -o /tmp/part01 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 4000000-5999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=2" -o /tmp/part02 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 6000000-7999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=3" -o /tmp/part03 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 8000000-9999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=4" -o /tmp/part04 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 10000000-11999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=5" -o /tmp/part05 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 12000000-13999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=6" -o /tmp/part06 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 14000000-15999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=7" -o /tmp/part07 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 16000000-17999999 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=8" -o /tmp/part08 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 18000000-19724952 "https://peripheral-building-stylish-decision.trycloudflare.com/cW2teHc4-5S8Cq2u8Zg0uY4i/review.mp4?part=9" -o /tmp/part09 &
          wait
          cat /tmp/part[0-9][0-9] > "$file"
          echo "f2aa1d19e54e2ce12aa3514a01bbf98aa4dcee26b3f1d3c44ea3a53f2e4fa725  $file" | sha256sum --check
          gh release upload temporary-review "$file" --clobber
          git add "$file"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Stage Zemlya picture edit for review"
          git pull --rebase origin preview-media-upload
          git push origin HEAD:preview-media-upload