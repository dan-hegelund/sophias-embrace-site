name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 2 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://scale-conducting-plots-underlying.trycloudflare.com/21qqMMmS3QfdaoOrj7vVJ6VYWweYqE19YnJy0w/@'
          cat fragments/?? > episode-five-you-know-me-56692014.mp4
          echo '56692014af8e103346b3750af6c014abb65cb8c927507efb649cf547bb88310b  episode-five-you-know-me-56692014.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-you-know-me-56692014.mp4 --clobber
