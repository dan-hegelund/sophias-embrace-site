name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 40 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://stylish-swaziland-stroke-highlighted.trycloudflare.com/fQYI1-P28nFO6gEbaZZWw-t9fcoZlgK0GACylw/@'
          cat fragments/?? > episode-five-full18-2c895509.mp4
          echo '2c89550968558fdea98aa5cf77ee5d0762846c80d9fd75c2825716e2a057445b  episode-five-full18-2c895509.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-full18-2c895509.mp4 --clobber