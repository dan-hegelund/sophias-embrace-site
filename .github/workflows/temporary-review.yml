name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/b91bf32e1c5bc224b2d68427ba17f4e4b7cabc96 >> episode-five-belt-b2e9d302.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/fd9b7bc0176379be2071b8b642c884e0f1a6d292 >> episode-five-belt-b2e9d302.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/148f43b24879093f3366c58130dfc0ce8176f29a >> episode-five-belt-b2e9d302.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/0ca6ad856a5b3375330932bc4d4bf69d3ba9c828 >> episode-five-belt-b2e9d302.mp4
          echo 'b2e9d302120474e210b2d27f8173bd232505ef0b0aac5c43503b87852e1e5a7c  episode-five-belt-b2e9d302.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-belt-b2e9d302.mp4 --clobber
