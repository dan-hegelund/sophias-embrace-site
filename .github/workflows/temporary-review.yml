name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/cee67a54c6d1722a296dd7c3cb6983c9295af73b >> episode-five-duet-9e3deffc.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/2e0273479397960bc03511168de1b5d05ce3eab9 >> episode-five-duet-9e3deffc.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/e9b5a70e287c94e8acb3a4ccd129c950b4ca2d10 >> episode-five-duet-9e3deffc.mp4
          echo '9e3deffcb4f0d9b5c64fd237e79983b647ebef910270c1a8144af65f95a94882  episode-five-duet-9e3deffc.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-duet-9e3deffc.mp4 --clobber
