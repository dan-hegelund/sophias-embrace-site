name: Prepare commentary phone stream
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package the checked review copy for mobile playback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download temporary-review --pattern 'e5-commentary-dan-53b9a715.mp4' --dir "$RUNNER_TEMP"
          which ffmpeg || (sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg)
          mkdir -p phone-review
          ffmpeg -nostdin -v error -i "$RUNNER_TEMP/e5-commentary-dan-53b9a715.mp4" -map 0:v -map 0:a -c copy -f hls -hls_time 8 -hls_list_size 0 -hls_playlist_type vod -hls_segment_filename 'phone-review/dan04-%03d.ts' phone-review/dan04.m3u8
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add phone-review
          git commit -m "Stage temporary commentary stream for iPhone"
          git push origin HEAD:preview-media-upload
