name: Stage commentary opening for review
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and host the revised opening
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=phone-review/e5-commentary05-opening-b572be44.mp4
          curl -fsSL --retry 5 --retry-all-errors --max-time 120 'https://herald-cuisine-use-arthur.trycloudflare.com/ShoO9uLF-iusoZbfej-y3A/review.mp4' -o "$file"
          echo "b572be44018d94a3000018b118c5b066a2dbf69caabfbc9e961b985da45adb6f  $file" | sha256sum --check
          gh release upload temporary-review "$file" --clobber
          git add "$file"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Stage Episode Five commentary welcome"
          git push origin HEAD:preview-media-upload
