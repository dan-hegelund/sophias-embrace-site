name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 90 \
            'https://drive.google.com/uc?export=download&confirm=t&id=1CSAbZKxpp0BC1aun8Z8eeN3hSDii_laf' \
            --output episode-five-train-placement-04.mp4
          echo '01a66138e9d5152f3d7e2cb5c27adb813aa3ba5700c2c023973bcac68d48fd43  episode-five-train-placement-04.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-train-placement-04.mp4 --clobber
