name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output e5-commentary-dan-53b9a715.mp4 'https://valued-permitted-narrow-adapted.trycloudflare.com/AumhXXGq33-vjCPXj_WyUg/review.mp4?v=dan04'
          echo '53b9a7152e148b7acb1deda5a5fb14cb717b7bff8fe5aa38568e32f508449c1e  e5-commentary-dan-53b9a715.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review e5-commentary-dan-53b9a715.mp4 --clobber
