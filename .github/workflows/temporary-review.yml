name: Illustrate Zemlya storyboard
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install artwork on the private storyboard
        run: |
          set -euo pipefail
          file=storyboard/zemlya/intervention08.bin
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 0-1999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z00 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 2000000-3999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z01 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 4000000-5999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z02 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 6000000-7999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z03 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 8000000-9999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z04 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 10000000-11999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z05 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 12000000-13999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z06 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 14000000-15999999 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z07 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 16000000-17208535 "https://sample-neighbor-labeled-mario.trycloudflare.com/qKuabeTOpEgdpWKfuWcNoYm_/board.bin" -o /tmp/z08 &
          wait
          cat /tmp/z[0-9][0-9] > "$file"
          echo "4ae2e5bb3993bfd2b69b3251a3d2ba791a1ba2e3ad2a9a1648d28f1ee07c25e9  $file" | sha256sum --check
          echo  | base64 -d > storyboard/zemlya/load08.js
          grep -q 'src="load07.js"' storyboard/zemlya/index.html
          sed -i 's/src="load07.js"/src="load08.js"/' storyboard/zemlya/index.html
          git add "$file" storyboard/zemlya/load08.js storyboard/zemlya/index.html
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Show why the machinist is detained in cards 29 through 33"
          git pull --rebase origin main
          git push origin HEAD:main
