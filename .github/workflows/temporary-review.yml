name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 2 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://movie-way-called-summary.trycloudflare.com/SUBSI-ty8Uxapt4eFc-Y3DZoDePolFTKB5-5Hw/@'
          cat fragments/?? > episode-five-greeting-4ed1df85.mp4
          echo '4ed1df8599b9d0c3f2f6319a6206fe77d07380c356ec8a4f2ab588067e59f7dc  episode-five-greeting-4ed1df85.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-greeting-4ed1df85.mp4 --clobber
