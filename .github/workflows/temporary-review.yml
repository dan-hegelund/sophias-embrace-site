name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f '%02g' 0 1 | xargs -P 4 -I @ curl -fLsS --retry 4 --retry-all-errors --max-time 120 --output fragments/@ 'https://phentermine-jurisdiction-saturday-rebound.trycloudflare.com/RgDrsWVV8sEn4fao7lW4jpKDeox9T8_1o7kL7Q/@'
          cat fragments/?? > changes.bin
          gh release download temporary-review --pattern 'episode-five-full30-372d6c17.mp4'
          python3 - <<'PYTHON'
          with open('changes.bin','rb') as patch,open('episode-five-full30-372d6c17.mp4','rb') as old,open('episode-five-full31-3d0590ea.mp4','wb') as out:
              for source,start,size in [['new', 0, 262144], ['old', 262144, 59506688], ['new', 262144, 7077888], ['old', 67096398, 215744512], ['new', 7340032, 7602176], ['old', 290917684, 250518780]]:
                  handle=old if source=='old' else patch
                  handle.seek(start)
                  while size:
                      block=handle.read(min(size,1048576))
                      assert block
                      out.write(block)
                      size-=len(block)
          PYTHON
          echo '3d0590eaf83f4efdf5c28e01a232140157962b2255dd60aa69e69d4a81a763b2  episode-five-full31-3d0590ea.mp4' | sha256sum -c
          gh release upload temporary-review 'episode-five-full31-3d0590ea.mp4' --clobber
