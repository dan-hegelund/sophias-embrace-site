name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/cb7d1b3cebbf4a1b083b04351fda473577d40330 >> episode-five-reprise-e3ef04de.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/5b11c42079f2e837720c31320afe8f63797bb715 >> episode-five-reprise-e3ef04de.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/63745535cdb1bc3da45e0e9c6554074ed705d24f >> episode-five-reprise-e3ef04de.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/dd37f3d088bdfb685d6d8a54413b7feeac0ac44e >> episode-five-reprise-e3ef04de.mp4
          echo 'e3ef04de11b1fd37970e4dfade39dee36d4a3fd0e9f241d44d4844bd60f57fb8  episode-five-reprise-e3ef04de.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-reprise-e3ef04de.mp4 --clobber
