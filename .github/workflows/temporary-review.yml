name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output episode-five-r7-db663166.mp4 'https://predicted-colorado-santa-dicke.trycloudflare.com/GBAnONAfLphBqVxK5pQvMGX4GCQnqcpexqLLaA'
          echo 'db663166547c38314e65394de6b845f9b7285ab4eb179b64388ab91e1fd95074  episode-five-r7-db663166.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-r7-db663166.mp4 --clobber
