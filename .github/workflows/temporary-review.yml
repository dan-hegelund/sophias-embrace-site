name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 7 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://fares-clinics-comparative-handled.trycloudflare.com/N-EuBGjJXgCk48EKPHxeARK8wxQxLHDJS27Uig/@'
          cat fragments/?? > episode-five-trial20-97b970a6.mp4
          echo '97b970a6110967178aa3c5a6c8e8afde8e00b13592fa51c00b226979080e11c5  episode-five-trial20-97b970a6.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-trial20-97b970a6.mp4 --clobber