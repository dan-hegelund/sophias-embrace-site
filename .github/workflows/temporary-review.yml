name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 2 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://modified-foo-push-modified.trycloudflare.com/L6K2K-65AsXcFqcKi6swW4AaMQcXVfqLBZDptA/@'
          cat fragments/?? > episode-five-earlier-a0071287.mp4
          echo 'a0071287d4a30cf782b2ef2dd657c5327eb14409b0a0ad9db6d738517bc34d4a  episode-five-earlier-a0071287.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-earlier-a0071287.mp4 --clobber
