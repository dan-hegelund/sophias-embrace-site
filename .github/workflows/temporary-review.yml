name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 44 | xargs -P 7 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://attorneys-enquiries-buildings-liverpool.trycloudflare.com/kIk0mCxt60WTfmqGYfnr4rYC7w78HD4gwiGkoQ/@'
          cat fragments/?? > episode-five-full28-ec30231d.mp4
          echo 'ec30231ddbec101d6b305f14657809034da9faa10017ab55df2942d7b9bf3854  episode-five-full28-ec30231d.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-full28-ec30231d.mp4 --clobber