name: Stage recorded commentary for film review
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and host the recorded commentary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=phone-review/e5-dan-memo06.mp4
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 0-1999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part00 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 2000000-3999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part01 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 4000000-5999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part02 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 6000000-7999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part03 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 8000000-9999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part04 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 10000000-11999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part05 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 12000000-13999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part06 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 14000000-15999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part07 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 16000000-17999999 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part08 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 18000000-18990071 "https://recommendation-tooth-office-tells.trycloudflare.com/N7oOFFgkdZpWuDQxQ2wnsCvK/review.mp4" -o /tmp/part09 &
          wait
          cat /tmp/part[0-9][0-9] > "$file"
          echo "cd933dde7037dc70f344a0af0d4535b4de394c85e814a1c09301288c8f4fc560  $file" | sha256sum --check
          gh release upload temporary-review "$file" --clobber
          git add "$file"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Stage Dan's recorded Episode Five commentary for review"
          git pull --rebase origin preview-media-upload
          git push origin HEAD:preview-media-upload
