name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 43 | xargs -P 7 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://affiliates-timothy-arrival-jokes.trycloudflare.com/MVdphcrs9SlFbUcG2lYuub2HEDGMxL8yzyXSkA/@'
          cat fragments/?? > episode-five-full26-9901eef0.mp4
          echo '9901eef0ea85c7e584c4fd97b20b15e2a77b0ded0c66b96634d8ad157078ec7b  episode-five-full26-9901eef0.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-full26-9901eef0.mp4 --clobber