name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f '%02g' 0 5 | xargs -P 4 -I @ curl -fLsS --retry 4 --retry-all-errors --max-time 180 --output fragments/@ 'https://carry-retreat-distinguished-eagles.trycloudflare.com/2ih_n8y8NjKHTlzxqxMexXvKhS7SBlRyRnRI3w/@'
          cat fragments/?? > episode-five-cut32-phone-81ce1c28.mp4
          echo '81ce1c284ca6ddff091d9e2d0891226abef9eb078c72b19cee3f0a51b320e017  episode-five-cut32-phone-81ce1c28.mp4' | sha256sum -c
          release_id=$(gh api repos/"$GH_REPO"/releases/tags/temporary-review --jq .id)
          curl -fsS --retry 2 -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: video/mp4' --data-binary @episode-five-cut32-phone-81ce1c28.mp4 "https://uploads.github.com/repos/$GH_REPO/releases/$release_id/assets?name=episode-five-cut32-phone-81ce1c28.mp4" -o receipt.json
          jq -e '.content_type == "video/mp4" and .size == 71621815' receipt.json
