name: Share Zemlya picture edit
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and host the picture edit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=phone-review/zemlya-full07b.mp4
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 0-1999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=0" -o /tmp/part00 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 2000000-3999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=1" -o /tmp/part01 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 4000000-5999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=2" -o /tmp/part02 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 6000000-7999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=3" -o /tmp/part03 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 8000000-9999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=4" -o /tmp/part04 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 10000000-11999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=5" -o /tmp/part05 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 12000000-13999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=6" -o /tmp/part06 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 14000000-15999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=7" -o /tmp/part07 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 16000000-17999999 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=8" -o /tmp/part08 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 18000000-19952459 "https://marine-cars-assure-quarterly.trycloudflare.com/rXAlxkDsBV-p0d6qruN_jBRg/review.mp4?v=final&part=9" -o /tmp/part09 &
          wait
          cat /tmp/part[0-9][0-9] > "$file"
          echo "105d370aac18066ba601b0f4981c9a8129ff319655587404c3793e07ba47c1b5  $file" | sha256sum --check
          gh release upload temporary-review "$file" --clobber
          git add "$file"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Stage Zemlya picture edit for review"
          git pull --rebase origin preview-media-upload
          git push origin HEAD:preview-media-upload