name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 90 \
            'https://drive.google.com/uc?export=download&confirm=t&id=1KNMsuTI_YOPCxyPwpFangjxHpZVLRqBr' \
            --output episode-five-crescent-camera-01.mp4
          echo '5eab97b3228287d245f7ec5d27a4df88f4dad1c8c6a173054d796afb63323b9d  episode-five-crescent-camera-01.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-crescent-camera-01.mp4 --clobber
