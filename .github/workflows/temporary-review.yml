name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output episode-five-r5-24df673f.mp4 'https://sharp-gateway-transcripts-slot.trycloudflare.com/uTiblVVgZxfOkv6kG6BByCKzThvNAjbNgnt5LQ'
          echo '24df673f730398fc20e57e8181ceb88ddbd7788adf447cffc188cee847596508  episode-five-r5-24df673f.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-r5-24df673f.mp4 --clobber
