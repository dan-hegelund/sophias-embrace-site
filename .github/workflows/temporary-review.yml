name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 3 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://cordless-weather-linked-config.trycloudflare.com/kwwmMJ5qMxJnmVhk2-FjfVK9FgcmkHzw3NZGPA/@'
          cat fragments/?? > episode-five-musical-review-dc2e4c2f.mp4
          echo 'dc2e4c2f35de1814ee9a28f531b4caf0b2a414f7824e34fa624325d35b08cfd9  episode-five-musical-review-dc2e4c2f.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-musical-review-dc2e4c2f.mp4 --clobber
