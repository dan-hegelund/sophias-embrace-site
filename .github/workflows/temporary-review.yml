name: Share Zemlya scene tests
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and host the scene tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          file=phone-review/zemlya-craft01.mp4
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 0-1999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part00 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 2000000-3999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part01 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 4000000-5999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part02 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 6000000-7999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part03 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 8000000-9999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part04 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 10000000-11999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part05 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 12000000-13999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part06 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 14000000-15999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part07 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 16000000-17999999 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part08 &
          curl -fsSL --retry 3 --retry-all-errors --max-time 240 -r 18000000-19240915 "https://distribution-keyboards-house-vhs.trycloudflare.com/GUnpdYe53hoalIqFTlezrerA/review.mp4" -o /tmp/part09 &
          wait
          cat /tmp/part[0-9][0-9] > "$file"
          echo "941cae20aaf34b6c0e21f5cc545fbcbfeced9e9571f0862d90e0db4f71a82aff  $file" | sha256sum --check
          gh release upload temporary-review "$file" --clobber
          git add "$file"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Stage Zemlya scene tests for review"
          git pull --rebase origin preview-media-upload
          git push origin HEAD:preview-media-upload
