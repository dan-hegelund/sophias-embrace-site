name: Illustrate Zemlya storyboard
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install artwork on the private storyboard
        run: |
          set -euo pipefail
          file=storyboard/zemlya/continuity07.bin
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 0-1999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z00 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 2000000-3999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z01 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 4000000-5999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z02 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 6000000-7999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z03 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 8000000-9999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z04 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 10000000-11999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z05 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 12000000-13999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z06 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 14000000-15999999 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z07 &
          curl -fsSL --max-time 180 --retry 3 --retry-all-errors -r 16000000-17934689 "https://looked-cup-disk-nails.trycloudflare.com/utbo-qPnoqe3Sw3yk4Ccar2o/board.bin" -o /tmp/z08 &
          wait
          cat /tmp/z[0-9][0-9] > "$file"
          echo "e73d5f964b9aeddc31ff6180694050641ee51b47274e94a3613886b2bc8af1d9  $file" | sha256sum --check
          echo  | base64 -d > storyboard/zemlya/load07.js
          grep -q 'src="load06.js"' storyboard/zemlya/index.html
          sed -i 's/src="load06.js"/src="load07.js"/' storyboard/zemlya/index.html
          git add "$file" storyboard/zemlya/load07.js storyboard/zemlya/index.html
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Illustrate the 54 Zemlya storyboard cards"
          git pull --rebase origin main
          git push origin HEAD:main
