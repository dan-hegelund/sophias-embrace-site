name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 43 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://postcard-sponsored-copper-hawaii.trycloudflare.com/Ff-VoKfBMk2smZo1r7rwtoapIofQIy97O91ypQ/@'
          cat fragments/?? > episode-five-full24-daf23883.mp4
          echo 'daf23883b088c5a5c324203fbe3fe0a80f48d2691eae09a4376a8cb9f9c1397d  episode-five-full24-daf23883.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-full24-daf23883.mp4 --clobber