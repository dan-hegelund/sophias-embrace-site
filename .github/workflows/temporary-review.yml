name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 34 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://cancellation-sys-construct-substance.trycloudflare.com/rirFUctjaGlYNpnKcg2dg-c8wCJ-l9Bgf6eNgQ/@'
          cat fragments/?? > episode-five-sync-10-7c7ff29e.mp4
          echo '7c7ff29ec570c072e6a7ce3b3f11d92f5eca7adcab11801977ee2a0f18661d37  episode-five-sync-10-7c7ff29e.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-sync-10-7c7ff29e.mp4 --clobber
