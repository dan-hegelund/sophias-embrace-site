name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output episode-five-r3-66c38ca7.mp4 'https://dust-terminal-witch-harmony.trycloudflare.com/NKopkK_ucPfAt91e_FQKVglfDZ3FWSHHQJJnJA'
          echo '66c38ca7d2777ad740d12f3ced368fe226379a776776f4110a0c89e67020ca34  episode-five-r3-66c38ca7.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-r3-66c38ca7.mp4 --clobber
