name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f '%02g' 0 0 | xargs -P 4 -I @ curl -fLsS --retry 4 --retry-all-errors --max-time 120 --output fragments/@ 'https://canyon-relocation-fate-strengthen.trycloudflare.com/6DDK9Z8oFJeKTSk-xtajpk6KuyqPke6dNZ1fsw/@'
          cat fragments/?? > changes.bin
          gh release download temporary-review --pattern 'episode-five-full31-3d0590ea.mp4'
          python3 - <<'PYTHON'
          with open('changes.bin','rb') as patch,open('episode-five-full31-3d0590ea.mp4','rb') as old,open('episode-five-full32-91cd3775.mp4','wb') as out:
              for source,start,size in [['new', 0, 262144], ['old', 262172, 59506688], ['new', 262144, 4980736], ['old', 66785491, 121110528], ['new', 5242880, 6815744], ['old', 194934879, 345777309]]:
                  handle=old if source=='old' else patch
                  handle.seek(start)
                  while size:
                      block=handle.read(min(size,1048576))
                      assert block
                      out.write(block)
                      size-=len(block)
          PYTHON
          echo '91cd37753404fb4bf4647e5e9f7f6ef570cd463ee6d0fcc9e992d654ef3c7938  episode-five-full32-91cd3775.mp4' | sha256sum -c
          gh release upload temporary-review 'episode-five-full32-91cd3775.mp4' --clobber
