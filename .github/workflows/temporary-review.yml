name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 3 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://levitra-game-tobago-rounds.trycloudflare.com/1O77iKQsaizh1bZCNrDDh6LywPNevDpBO3eOeA/@'
          cat fragments/?? > episode-five-voronov17-d9dcaabb.mp4
          echo 'd9dcaabb927f3fb7debfec9ff8ffcecba5208732e58173ffb17af581a7144b2d  episode-five-voronov17-d9dcaabb.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-voronov17-d9dcaabb.mp4 --clobber