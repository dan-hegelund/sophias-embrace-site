name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/b74f2e8f718df5d0f782dbb39b9c65d830f4762e >> episode-five-ending-53beac73.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/2b81620951b3be0ec49c296f0268655b97e7faab >> episode-five-ending-53beac73.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/c742b54a55e104d065b5f9a7d901e902f89be45e >> episode-five-ending-53beac73.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/f10b30d49436750fd6a64fa562671b5096983d62 >> episode-five-ending-53beac73.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/f1dbf2ea63dd05ca92a3b5be2cd6682d40f7322b >> episode-five-ending-53beac73.mp4
          gh api -H 'Accept: application/vnd.github.raw+json' repos/$GH_REPO/git/blobs/1b527b7f06827d212b34f69960e31d9b2c2b9d82 >> episode-five-ending-53beac73.mp4
          echo '53beac730ad7084972b3f6af93c113e5b4dbd2b20897efdcde89a1ec4d8177d8  episode-five-ending-53beac73.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-ending-53beac73.mp4 --clobber
