name: Update encrypted Zemlya storyboard
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update the approved audio and timings
        run: |
          set -euo pipefail
          file=storyboard/zemlya/board.bin
          test "$(git rev-parse HEAD:$file)" = eca953818c2390bc961b0099b2f10fd6e21e3bec
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 0-1999999 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z00 &
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 2000000-3999999 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z01 &
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 4000000-5999999 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z02 &
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 6000000-7999999 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z03 &
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 8000000-9999999 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z04 &
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 10000000-11999999 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z05 &
          curl -fsSL --max-time 240 --retry 3 --retry-all-errors -r 12000000-12290379 "https://expanded-republican-mistress-intensity.trycloudflare.com/ZCpIakDbpY5amD4D8KxCUb2g/board.bin" -o /tmp/z06 &
          wait
          cat /tmp/z[0-9][0-9] > "$file"
          echo "3ef900a08fa50f4e6b474f8ce3272832deda5f09891758c528898c6ad84c57c7  $file" | sha256sum --check
          git add "$file"
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -m "Retime the Zemlya storyboard to approved take 25A"
          git pull --rebase origin main
          git push origin HEAD:main
