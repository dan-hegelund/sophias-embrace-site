name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f '%02g' 0 5 | xargs -P 6 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 150 --output fragments/@ 'https://vat-fellow-says-coverage.trycloudflare.com/3fOBC6qC1XlILafnbEkVkxWOHiENu_Ph488xqQ/@'
          cat fragments/?? > tail.bin
          for n in $(seq 1 90); do
            if gh release download temporary-review --pattern 'episode-five-full29-8905202f.mp4' --clobber; then break; fi
            sleep 5
          done
          python3 - <<'PYTHON'
          from pathlib import Path
          with open('tail.bin','rb') as patch, open('episode-five-full29-8905202f.mp4','rb') as old, open('episode-five-full30-372d6c17.mp4','wb') as target:
              target.write(patch.read(167069))
              old.seek(167069)
              left=476789923
              while left:
                  block=old.read(min(1048576,left))
                  assert block
                  target.write(block)
                  left-=len(block)
              target.write(patch.read())
          PYTHON
          echo '372d6c1745ef16c985d2e50fe2071fd393dc0e8712be2474e5d8b7bac69132cf  episode-five-full30-372d6c17.mp4' | sha256sum --check
          gh release upload temporary-review 'episode-five-full30-372d6c17.mp4' --clobber
