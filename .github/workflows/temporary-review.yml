name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir fragments
          seq -f "%02g" 0 3 | xargs -P 3 -I @ curl --fail --location --retry 5 --retry-all-errors --connect-timeout 15 --max-time 120 --output fragments/@ 'https://article-greetings-julia-bond.trycloudflare.com/cKb6rRjfeu_vOVmA__kscmjc47zT4hBiF4A1Ng/@'
          cat fragments/?? > episode-five-name-0210f6ab.mp4
          echo '0210f6abcf786785dc42cb31cd91a3be6b8b3af02da2ecacbc08fc999bce7121  episode-five-name-0210f6ab.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-name-0210f6ab.mp4 --clobber