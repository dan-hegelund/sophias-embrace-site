name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --output episode-five-r8-f0f9f1ac.mp4 'https://genesis-depot-petroleum-debian.trycloudflare.com/cgmH5MliUp1jeTxHNzm6wryO-IqrXjolnDoJeQ'
          echo 'f0f9f1ac39fa9ec844cd26db64cd1b881bde9d890ee3097b44ece849bcc74246  episode-five-r8-f0f9f1ac.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-r8-f0f9f1ac.mp4 --clobber
