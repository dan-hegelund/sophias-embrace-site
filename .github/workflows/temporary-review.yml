name: Host the current review clip
on:
  push:
    branches: [preview-media-upload]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the temporary asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 90 \
            'https://drive.google.com/uc?export=download&confirm=t&id=1o2EhPTBZ3u0wMGukovWcp4s-O_RR56-i' \
            --output episode-five-train-placement-03.mp4
          echo '9a112d9d34e93842a3de0445e3a6ec6b3f0725648b5804fc01c033da341e4c25  episode-five-train-placement-03.mp4' | sha256sum --check
          if ! gh release view temporary-review >/dev/null 2>&1; then
            gh release create temporary-review --target main --prerelease \
              --title 'Temporary review media' --notes 'Current review clip for sophiasembrace.com/temp/.'
          fi
          gh release upload temporary-review episode-five-train-placement-03.mp4 --clobber
